[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithm-benchmarking-suite"
version = "0.1.0"
description = "A modular algorithm benchmarking and profiling suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
absuite = "absuite.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
